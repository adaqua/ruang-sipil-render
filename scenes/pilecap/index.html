<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pile Cap Strut-and-Tie — RuangSipil 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #e9edf1; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  .labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .label {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 6px;
    padding: 5px 10px;
    font: 700 16px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #ffffff;
    letter-spacing: 0.03em;
    box-shadow: 0 1px 5px rgba(15, 23, 42, 0.30);
    white-space: nowrap;
  }
  .label.bad { background: rgba(185, 28, 28, 0.92); border-color: #fecaca; }
  .label.ok { background: rgba(21, 128, 61, 0.92); border-color: #bbf7d0; }
  .leader { stroke: #334155; stroke-width: 1.5; fill: none; }
  .leader.bad { stroke: #b91c1c; }
  .leader.ok { stroke: #15803d; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div class="labels" id="labels"></div>
</div>
