name: Render 3D scene

# Render a Three.js scene to MP4 on a GitHub-hosted runner (4 vCPU, 16 GB RAM).
#
# Two ways to render:
#  - Push a scene change (scenes/** or scripts/**): renders the default
#    scene (dak, 10s, 60fps, 720x1280) automatically.
#  - Actions tab -> Run workflow: pick scene / seconds / fps / size.
#
# The MP4 is saved two ways: as a workflow artifact (kept 7 days) AND
# committed back to renders/ in this repo, so the VM can fetch it with
# plain curl (no auth needed, the repo is public).
# renders/** is excluded from the push trigger so the commit-back step
# does not re-trigger the workflow.
#
# Only render code lives in this repo. NEVER commit secrets, tokens,
# the hook library, or channel skill files here.
# vendor/ (three.js) is NOT committed: the workflow downloads pinned
# three@0.169.0 from jsDelivr at runtime (byte-identical to the local
# copy used to test the scene on the VM).

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

on:
  push:
    paths:
      - "scenes/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene folder under scenes/ (e.g. dak)"
        required: true
        default: "dak"
      seconds:
        description: "Video length in seconds"
        required: true
        default: "10"
      fps:
        description: "Frames per second"
        required: true
        default: "60"
      size:
        description: "Viewport WxH (e.g. 720x1280)"
        required: true
        default: "720x1280"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCENE: ${{ inputs.scene || 'dak' }}
      DURATION: ${{ inputs.seconds || '10' }}
      FPS: ${{ inputs.fps || '60' }}
      SIZE: ${{ inputs.size || '720x1280' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Playwright Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install playwright
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium

      - name: Fetch three.js vendor (pinned 0.169.0)
        run: |
          mkdir -p "scenes/${SCENE}/vendor/addons/environments"
          curl -fsSL -o "scenes/${SCENE}/vendor/three.module.js" https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js
          curl -fsSL -o "scenes/${SCENE}/vendor/addons/environments/RoomEnvironment.js" https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/environments/RoomEnvironment.js
          ls -l "scenes/${SCENE}/vendor" "scenes/${SCENE}/vendor/addons/environments"

      - name: Serve scenes
        run: |
          python3 scripts/serve.py scenes --port 8000 &
          sleep 2
          curl -s -o /dev/null -w "server: %{http_code}\n" "http://127.0.0.1:8000/${SCENE}/"

      - name: Render scene to MP4
        run: |
          python3 scripts/record.py \
            "http://127.0.0.1:8000/${SCENE}/?record=1" \
            "${SCENE}-${DURATION}s.mp4" \
            --seconds "${DURATION}" \
            --fps "${FPS}" \
            --size "${SIZE}" \
            --ready "window.__ready === true"
          ls -la *.mp4
          ffprobe -v error -show_entries format=duration \
            -of csv=p=0 "${SCENE}-${DURATION}s.mp4"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCENE }}-${{ env.DURATION }}s
          path: ${{ env.SCENE }}-${{ env.DURATION }}s.mp4
          retention-days: 7

      - name: Commit MP4 back to renders/
        run: |
          mkdir -p renders
          cp "${SCENE}-${DURATION}s.mp4" "renders/${SCENE}-${DURATION}s.mp4"
          git config user.name "ruang-sipil-render"
          git config user.email "render@ruangsipil.local"
          git add "renders/${SCENE}-${DURATION}s.mp4"
          git commit -m "Render ${SCENE} ${DURATION}s @ ${FPS}fps ${SIZE}" || echo "nothing to commit"
          git push
