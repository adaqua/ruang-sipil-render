name: Render 3D scene

# Render scene three.js ke MP4 di runner GitHub (4 vCPU, 16 GB RAM bila repo publik).
#
# Dua cara memicu:
#  1) OTOMATIS: push perubahan di scenes/**. Durasi, fps, dan ukuran dibaca dari
#     scenes/<scene>/render.json, jadi video 30 detik juga otomatis tanpa tombol.
#       contoh render.json: {"seconds": 30, "fps": 60, "size": "720x1280"}
#     Tanpa render.json: pakai default 10 detik, 60 fps, 720x1280.
#  2) MANUAL (opsional): Actions -> Render 3D scene -> Run workflow.
#
# Scene yang dirender = folder pertama di scenes/ yang berubah pada push itu
# (fallback: dak). Satu push sebaiknya hanya mengubah satu scene.
#
# Hasil: artifact (7 hari) dan di-commit ke renders/. renders/** tidak ada di
# trigger push, jadi commit hasil tidak memicu render ulang.
#
# Hanya kode render di repo ini. JANGAN commit secret, token, hook library,
# atau file skill channel. vendor/ (three.js) diunduh saat jalan, tidak di-commit.

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

on:
  push:
    paths:
      - "scenes/**"
  workflow_dispatch:
    inputs:
      scene:
        description: "Folder scene di scenes/ (mis. dak)"
        required: true
        default: "dak"
      seconds:
        description: "Durasi video (detik)"
        required: true
        default: "10"
      fps:
        description: "Frame per detik"
        required: true
        default: "60"
      size:
        description: "Viewport LxT (mis. 720x1280)"
        required: true
        default: "720x1280"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tentukan scene dan pengaturan
        env:
          IN_SCENE: ${{ inputs.scene }}
          IN_SECONDS: ${{ inputs.seconds }}
          IN_FPS: ${{ inputs.fps }}
          IN_SIZE: ${{ inputs.size }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCENE="$IN_SCENE"; DURATION="$IN_SECONDS"; FPS="$IN_FPS"; SIZE="$IN_SIZE"
          else
            # scene = folder pertama di scenes/ yang berubah pada push ini
            if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
              CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- scenes/ || true)
            else
              CHANGED=$(git show --name-only --pretty=format: "$GITHUB_SHA" -- scenes/ || true)
            fi
            SCENE=$(echo "$CHANGED" | grep '^scenes/' | cut -d/ -f2 | sort -u | head -1)
            SCENE="${SCENE:-dak}"
            CFG="scenes/${SCENE}/render.json"
            DURATION=10; FPS=60; SIZE="720x1280"
            if [ -f "$CFG" ]; then
              DURATION=$(jq -r '.seconds // 10' "$CFG")
              FPS=$(jq -r '.fps // 60' "$CFG")
              SIZE=$(jq -r '.size // "720x1280"' "$CFG")
            fi
          fi
          echo "SCENE=$SCENE"       >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "FPS=$FPS"           >> "$GITHUB_ENV"
          echo "SIZE=$SIZE"         >> "$GITHUB_ENV"
          echo "Render: scene=$SCENE durasi=${DURATION}s fps=$FPS ukuran=$SIZE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg dan Playwright Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install playwright
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium

      - name: Unduh three.js (versi terkunci 0.169.0)
        run: |
          mkdir -p "scenes/${SCENE}/vendor/addons/environments"
          curl -fsSL -o "scenes/${SCENE}/vendor/three.module.js" https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js
          curl -fsSL -o "scenes/${SCENE}/vendor/addons/environments/RoomEnvironment.js" https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/environments/RoomEnvironment.js
          ls -l "scenes/${SCENE}/vendor" "scenes/${SCENE}/vendor/addons/environments"

      - name: Jalankan server scene
        run: |
          python3 scripts/serve.py scenes --port 8000 &
          sleep 2
          curl -s -o /dev/null -w "server: %{http_code}\n" "http://127.0.0.1:8000/${SCENE}/"

      - name: Render scene ke MP4
        run: |
          python3 scripts/record.py \
            "http://127.0.0.1:8000/${SCENE}/?record=1" \
            "${SCENE}-${DURATION}s.mp4" \
            --seconds "${DURATION}" \
            --fps "${FPS}" \
            --size "${SIZE}" \
            --ready "window.__ready === true"
          ls -la *.mp4
          ffprobe -v error -show_entries format=duration \
            -of csv=p=0 "${SCENE}-${DURATION}s.mp4"

      - name: Unggah artifact MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCENE }}-${{ env.DURATION }}s
          path: ${{ env.SCENE }}-${{ env.DURATION }}s.mp4
          retention-days: 7

      - name: Commit MP4 ke renders/
        run: |
          mkdir -p renders
          cp "${SCENE}-${DURATION}s.mp4" "renders/${SCENE}-${DURATION}s.mp4"
          git config user.name "ruang-sipil-render"
          git config user.email "render@ruangsipil.local"
          git add "renders/${SCENE}-${DURATION}s.mp4"
          git commit -m "Render ${SCENE} ${DURATION}s @ ${FPS}fps ${SIZE}" || echo "tidak ada perubahan"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
